name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    # Leave CI_RUNNER unset for GitHub-hosted runners; set it to a self-hosted label when needed.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, pdo, pdo_sqlite, curl, json, openssl, zip, intl
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --no-interaction --no-ansi
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyze
      - run: composer test
      - run: composer test:coverage
      - run: composer coverage:check

  mysql:
    name: Integration on MySQL 8
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: app_test
        ports: ['3306']          # dynamic host port; never bind a fixed one
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mbstring, dom, pdo, pdo_mysql, curl, json, openssl, zip, intl', tools: 'composer:v2' }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Integration suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: app_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-not-a-secret
        run: composer test:mysql
